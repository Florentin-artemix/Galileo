spring:
  datasource:
    url: jdbc:h2:mem:galileodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS vector AS VARCHAR\;CREATE DOMAIN IF NOT EXISTS jsonb AS JSON
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false

galileo:
  storage:
    type: local
    local-dir: ./uploads-h2
