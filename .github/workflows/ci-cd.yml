name: Galileo CI/CD Pipeline

on:
  push:
    branches: [main, develop, fix/*]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ============================================
  # FRONTEND - Typecheck, Build & Test
  # ============================================
  frontend:
    name: 🎨 Frontend Check & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      - name: 🏗️ Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ============================================
  # BACKEND - Spring Boot Build & Tests
  # ============================================
  backend:
    name: ☕ Backend Test & Package
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔧 Ensure Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: 🧪 Run backend tests
        working-directory: ./backend
        run: ./mvnw test
        env:
          JWT_SECRET: "CiCdPipelineTestSecretKeyMustBeAtLeast256BitsLongForHmacShaCompliance12345"

      - name: 🔨 Package Spring Boot JAR
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: 📤 Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: galileo-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ============================================
  # SUMMARY
  # ============================================
  ci-summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()
    
    steps:
      - name: 📊 Build Summary
        run: |
          echo "## 🚀 Galileo CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Typecheck & Build) | ${{ needs.frontend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Tests & Package) | ${{ needs.backend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
